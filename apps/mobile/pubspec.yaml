version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  archive: ^3.6.1
  flutter:
    sdk: flutter
  canto_core:
    path: ../../bindings/dart
  crypto: ^3.0.6
  ffi: ^2.1.4
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.1.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
